# GitHub Actions, pinned to the commit of their release: one pull request per
# action.
name: "Bump GitHub Actions"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .scm.owner }}'
      repository: '{{ .scm.repository }}'
      branch: '{{ .scm.branch }}'
      user: '{{ .scm.user }}'
      email: '{{ .scm.email }}'
      username: '{{ requiredEnv "GITHUB_ACTOR" }}'
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      labels:
        - dependencies

autodiscovery:
  scmid: default
  actionid: default
  groupby: individual
  crawlers:
    github/action:
      digest: true
      versionfilter:
        kind: semver
