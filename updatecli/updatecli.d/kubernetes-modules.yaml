# The Kubernetes libraries and controller-runtime move together: one pull
# request for all of them (AGENTS.md, "GitHub Actions and maintenance
# automation").
name: "Bump the Kubernetes modules"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .scm.owner }}'
      repository: '{{ .scm.repository }}'
      branch: '{{ .scm.branch }}'
      user: '{{ .scm.user }}'
      email: '{{ .scm.email }}'
      username: '{{ requiredEnv "GITHUB_ACTOR" }}'
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      labels:
        - dependencies

autodiscovery:
  scmid: default
  actionid: default
  groupby: all
  crawlers:
    golang/gomod:
      onlygomodule: true
      only:
        - modules:
            "k8s.io/*": ""
            "sigs.k8s.io/controller-runtime": ""
      versionfilter:
        kind: semver
