{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kumaco.name" . }}-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kumaco.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kumaco.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.metrics.port }}
      protocol: TCP
      targetPort: metrics
{{- end }}
