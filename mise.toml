# Development tools and tasks (see AGENTS.md, "Tooling, CI, and releases").
# Every version is exact; mise.lock records the checksums.

[env]
# Only use the Go toolchain pinned below: never let Go download another one.
GOTOOLCHAIN = "local"

[tools]
go = "1.27.4"
# kind and the node image in test/e2e/kind.yaml are bumped together: the image
# must be the default node image of this kind release.
kind = "0.33.0"
# Only runs the cognitive-complexity linter: see .golangci.yml.
golangci-lint = "2.15.0"
# The release: binaries, images, SBOMs and signatures (mise run release:*).
goreleaser = "2.20.2"
cosign = "3.1.4"
syft = "1.57.2"
# Checks the GitHub Actions workflows (mise run lint).
actionlint = "1.7.12"
# Security scans (mise run scan:trivy, scan:snyk).
trivy = "0.76.2"
snyk = "1.1308.4"
# Render and check the deployment manifests.
kustomize = "5.8.3"
helm = "4.3.2"
# Kubernetes' checker of logging calls. It has no release binary: mise builds
# this exact version from source.
"go:sigs.k8s.io/logtools/logcheck" = "0.11.0"

# envtest control plane (kube-apiserver and etcd) of the supported Kubernetes
# minor release. Its binaries are not put on PATH: test:envtest passes their
# directory to the tests.
[tools."http:envtest"]
version = "1.37.0"
url = 'https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v{{ version }}/envtest-v{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz'
checksum_url = 'https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v{{ version }}/envtest-v{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz.sha512'
# The checksum file names the archive with a leading "/", which mise does not
# match against the archive name: take the hash, its first field.
checksum_expr = '"sha512:" + split(body, " ")[0]'

# Generates the deepcopy code, the CRD, and the RBAC role (mise run generate).
[tools."http:controller-gen"]
version = "0.23.0"
url = 'https://github.com/kubernetes-sigs/controller-tools/releases/download/v{{ version }}/controller-gen-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}'
bin = "controller-gen"

# Tasks: the names are fixed by AGENTS.md ("Standard tasks"). CI runs the same
# tasks.

[tasks.fmt]
description = "Format the code in place"
run = "gofmt -w ."

[tasks.lint]
description = "Check formatting, run go vet and logcheck on every build-tag variant, and check the workflows"
run = [
  'unformatted="$(gofmt -l .)"; test -z "$unformatted" || { echo "not formatted (mise run fmt):"; echo "$unformatted"; exit 1; }',
  "go vet ./...",
  "go vet -tags=envtest ./...",
  "go vet -tags=e2e ./...",
  # Logging calls, including their key/value pairs, which go vet does not check.
  "logcheck ./...",
  "logcheck -tags=envtest ./...",
  "logcheck -tags=e2e ./...",
  # The GitHub Actions workflows.
  "actionlint",
]

[tasks.generate]
description = "Regenerate the deepcopy code, the CRD, and the RBAC role, for the kustomize manifests and the Helm chart"
run = [
  "controller-gen object crd rbac:roleName=kumaco paths=./... output:crd:artifacts:config=config/crd/bases output:rbac:artifacts:config=config/rbac",
  # The Helm chart is rendered from the same CRD and role as the kustomize manifests.
  "cp config/crd/bases/kumaco.kured.dev_maintenancewindows.yaml charts/kumaco/generated/crd.yaml",
  "cp config/rbac/role.yaml charts/kumaco/generated/role.yaml",
]

[tasks."generate:check"]
description = "Run generate and fail if it changed the working tree"
run = """
state() { git status --porcelain; git diff; }
before="$(state)"
mise run generate
test "$before" = "$(state)" || { echo "generate:check: mise run generate changed the working tree: commit its output"; exit 1; }
"""

[tasks.test]
description = "Unit tests"
run = "go test ./..."

[tasks."test:race"]
description = "Unit tests with the race detector"
run = "go test -race ./..."

[tasks.bench]
description = "Benchmarks, including the 10,000-node scale benchmarks of the controller"
run = "go test -run '^$' -bench . -benchmem ./internal/..."

[tasks."test:fuzz"]
# Go fuzzes one function of one package at a time.
description = "Fuzz tests, 30 seconds each"
run = [
  "go test ./internal/schedule -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s",
  "go test ./internal/trigger -run '^$' -fuzz '^FuzzCompile$' -fuzztime 30s",
]

[tasks."test:envtest"]
description = "envtest suite: tests against a real kube-apiserver and etcd"
run = 'KUBEBUILDER_ASSETS="$(mise where http:envtest)/envtest" go test -tags=envtest -count=1 ./...'

[tasks.image]
# The same Dockerfile as the release, for this machine's architecture only.
# CONTAINER_TOOL defaults to the provider kind uses.
description = "Build the kumaco image as ghcr.io/kubereboot/kumaco:dev, and save it in .tmp/image/kumaco.tar"
run = """
set -eu
tool="${CONTAINER_TOOL:-${KIND_EXPERIMENTAL_PROVIDER:-docker}}"
arch="$(go env GOARCH)"
rm -rf .tmp/image
mkdir -p ".tmp/image/linux/$arch"
CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o ".tmp/image/linux/$arch/kumaco" ./cmd
"$tool" build --platform "linux/$arch" --build-arg "TARGETPLATFORM=linux/$arch" --tag ghcr.io/kubereboot/kumaco:dev --file Dockerfile .tmp/image
"$tool" save --output .tmp/image/kumaco.tar ghcr.io/kubereboot/kumaco:dev
"""

[tasks.e2e]
# The tests require a cluster name: this task designates kumaco-e2e. mise
# appends the arguments of the task, and the last -cluster wins:
#   mise run e2e -- -keep
#   mise run e2e -- -cluster=<name>
description = "Kind e2e suite, on the kind cluster kumaco-e2e. Creates it unless an earlier run kept it, and deletes it afterwards unless -keep is given"
# The suite deploys the image that this build saved.
depends = ["image"]
run = "go test -tags=e2e -count=1 -timeout=45m -v ./test/e2e -args -cluster=kumaco-e2e"

[tasks."scan:trivy"]
# The policy was agreed with the maintainers (AGENTS.md, "Security and license
# scanning"): HIGH and CRITICAL findings fail, vulnerabilities only when a fix
# exists. Exceptions go in .trivyignore.yaml, each with a reason and an expiry.
# It needs network access, to download the vulnerability database.
description = "Trivy scans of the repository, its configuration (Dockerfile, manifests, chart), and the image"
depends = ["image"]
run = [
  "trivy filesystem --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --skip-dirs .tmp --skip-dirs dist --exit-code 1 .",
  "trivy image --input .tmp/image/kumaco.tar --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1",
]

[tasks."scan:snyk"]
# Snyk needs an account token, so this task only runs in CI, in trusted
# contexts. Without the token it fails: it never skips.
description = "Snyk dependency and license scan (CI only: needs SNYK_TOKEN)"
run = """
test -n "${SNYK_TOKEN:-}" || { echo "scan:snyk: SNYK_TOKEN is not set: this scan needs a Snyk account token, and cannot pass without it"; exit 1; }
snyk test --severity-threshold=high
"""

[tasks."release:check"]
description = "Validate the GoReleaser configuration"
run = "goreleaser check --config .config/goreleaser.yaml"

[tasks."release:snapshot"]
# Nothing is published or signed: the images stay in the local container
# engine, and the artifacts in dist/ and .tmp/release/.
description = "Non-publishing preview of a release: binaries, images, SBOMs, manifests and chart"
env = { REGISTRY = "ghcr.io", IMAGE_NAME = "kubereboot/kumaco" }
run = 'GO_VERSION="$(go env GOVERSION)" goreleaser release --config .config/goreleaser.yaml --snapshot --clean --skip=sign'

[tasks."release:publish"]
# Only the tag workflow runs this: it publishes images to ghcr.io and a GitHub
# release, and signs them with the identity of the workflow.
description = "Publish a release (tag workflow only: needs GITHUB_TOKEN and a signed tag)"
env = { REGISTRY = "ghcr.io", IMAGE_NAME = "kubereboot/kumaco" }
run = """
test -n "${GITHUB_TOKEN:-}" || { echo "release:publish: GITHUB_TOKEN is not set: only the tag workflow publishes releases"; exit 1; }
GO_VERSION="$(go env GOVERSION)" goreleaser release --config .config/goreleaser.yaml --clean
"""

[tasks."lint:deps"]
description = "Dependency-policy gate: direct modules, imports, and exception reviews"
run = "go run ./hack/lint-deps"

[tasks."lint:complexity"]
description = "Cognitive-complexity gate (gocognit, at most 15 per function)"
run = [
  "golangci-lint run ./...",
  "golangci-lint run --build-tags=envtest ./...",
  "golangci-lint run --build-tags=e2e ./...",
]

[tasks."lint:contracts"]
description = "Check the links between the sections of README.md and the tests"
run = "go run ./hack/lint-contracts"
